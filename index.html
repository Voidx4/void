<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Key Display</title>
  <style>
    :root {
      color-scheme: dark;
      --black: #050505;
      --white: #ffffff;
      --soft-white: #d9d9d9;
      --gray: #969696;
      --line: rgba(255, 255, 255, 0.16);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--white);
      background:
        radial-gradient(circle at 50% 40%, #272727 0%, #111111 30%, var(--black) 72%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.24;
      background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(ellipse at center, black, transparent 76%);
    }

    .display {
      position: relative;
      width: min(88vw, 760px);
      padding: clamp(2rem, 6vw, 4.5rem);
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(255,255,255,.11), rgba(255,255,255,.035));
      box-shadow: 0 30px 90px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.12);
      backdrop-filter: blur(14px);
    }

    .display::before,
    .display::after {
      content: "";
      position: absolute;
      width: 68px;
      height: 68px;
      border-color: rgba(255,255,255,.45);
      border-style: solid;
    }

    .display::before {
      top: 18px;
      left: 18px;
      border-width: 1px 0 0 1px;
      border-radius: 12px 0 0 0;
    }

    .display::after {
      right: 18px;
      bottom: 18px;
      border-width: 0 1px 1px 0;
      border-radius: 0 0 12px 0;
    }

    .label {
      margin: 0 0 18px;
      color: var(--gray);
      font-size: .72rem;
      font-weight: 700;
      letter-spacing: .32em;
      text-transform: uppercase;
    }

    .key {
      margin: 0;
      color: var(--white);
      font-size: clamp(1.5rem, 5.3vw, 3.35rem);
      font-weight: 800;
      letter-spacing: .08em;
      line-height: 1.18;
      word-break: break-word;
      text-shadow: 0 0 28px rgba(255,255,255,.2);
    }

    .rule {
      width: 76px;
      height: 3px;
      margin: 25px auto 19px;
      border-radius: 999px;
      background: var(--white);
      box-shadow: 0 0 20px rgba(255,255,255,.7);
    }

    .caption {
      margin: 0;
      color: var(--soft-white);
      font-size: .88rem;
      letter-spacing: .08em;
    }

    @media (max-width: 480px) {
      .display { border-radius: 22px; }
      .key { letter-spacing: .045em; }
    }
  </style>
</head>
<body>
  <main class="display" aria-label="Key display">
    <p class="label">Access Key</p>
    <h1 class="key">dr3p-X7k9Q2mL8vN</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="caption">Centered • Secure • Monochrome</p>
  </main>
</body>
</html>
